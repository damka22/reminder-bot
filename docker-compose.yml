version: '3.8'

services:
  bot:
    build: .
    container_name: reminder_bot
    env_file: .env
    volumes:
      - ./remind_base.db:/app/remind_base.db:rw
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:exec,nosuid,nodev,size=100m
    security_opt:
      - no-new-privileges:true
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge
    internal: false
